apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - service-canary.yaml
  - ingress.yaml
  - rollout.yaml

labels:
  - pairs:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
